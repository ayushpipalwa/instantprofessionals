name: Payment integration tests
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  payments:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: payments_test
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: ip_payments_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U payments_test -d ip_payments_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
        working-directory: payments/backend
      - name: Prepare isolated invoice test database
        working-directory: payments/backend
        run: |
          node --input-type=module <<'JS'
          import pg from 'pg';
          const db = new pg.Pool({host:'127.0.0.1',user:'payments_test',password:'disposable_ci_only',database:'ip_payments_test'});
          try { await db.query('CREATE DATABASE ip_payments_invoice_test'); }
          finally { await db.end(); }
          JS
      - run: node --test payments/backend/test/*.test.mjs
        env:
          PAYMENT_TEST_DATABASE: disposable
      - run: node --check payments/app.js
      - run: node --check assets/js/enquiry.js
      - run: python3 scripts/build_pages.py
