name: Static SEO validation

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate metadata, structured data, sitemap and links
        run: python scripts/qa_seo.py
      - name: Stage public site
        run: python scripts/build_pages.py
