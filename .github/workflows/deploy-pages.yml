name: Deploy static site to Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate live team photo folder
        shell: bash
        run: |
          set -euo pipefail
          photo_folder="assets/img/team/live"
          test -d "$photo_folder"

          photo_count=0
          while IFS= read -r -d '' portrait; do
            photo_count=$((photo_count + 1))
            test -s "$portrait"
            mime_type="$(file --brief --mime-type "$portrait")"
            byte_size="$(stat -c%s "$portrait")"
            echo "Checking $portrait ($mime_type, ${byte_size} bytes)"
            test "$mime_type" = "image/jpeg"
          done < <(find "$photo_folder" -maxdepth 1 -type f -name '*.jpg' -print0)

          test "$photo_count" -gt 0
          test "$(stat -c%s "$photo_folder/renu-sharma.jpg")" -ge 30000
          test "$(stat -c%s "$photo_folder/navdha-puri.jpg")" -ge 20000
          echo "Validated $photo_count live team portrait(s)."

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Stage public files only
        run: python3 scripts/build_pages.py

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
