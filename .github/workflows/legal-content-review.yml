name: Monthly legal content review

on:
  schedule:
    - cron: "0 4 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  open-review:
    runs-on: ubuntu-latest
    steps:
      - name: Check for an open legal review
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "legal-content-review",
              per_page: 1
            });
            core.setOutput("exists", data.length ? "true" : "false");

      - name: Open consolidated review issue
        if: steps.check.outputs.exists != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const reviewed = new Date().toISOString().slice(0, 10);
            const body = [
              "Review the active service catalogue against primary official sources.",
              "",
              "### Mandatory families",
              "- [ ] Income Tax & TDS — Income Tax Department, CBDT, India Budget and e-Gazette",
              "- [ ] GST — CBIC, GST Council, GST portal and e-Gazette",
              "- [ ] Companies / LLP — MCA and e-Gazette",
              "- [ ] EPF / ESI — EPFO, ESIC and Ministry of Labour",
              "- [ ] Trademarks / Copyright / Patents — IP India, Copyright Office and DPIIT",
              "- [ ] Import / Export — DGFT and CBIC Customs",
              "- [ ] MSME, PAN/TAN and DSC registrations — relevant official portals",
              "- [ ] Business advisory pages — India Code and sector regulator where applicable",
              "",
              "### For every confirmed change",
              "- Record official URL, notification/circular number, effective date and transition rule.",
              "- Update affected page text, calculator assumptions, official links, reviewed date and sitemap lastmod.",
              "- Use a focused pull request. Do not publish legal or calculator changes directly.",
              "",
              "Review control: LEGAL_CONTENT_MAINTENANCE.md",
              "Issue generated: " + reviewed
            ].join("\n");
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "Legal content review — " + reviewed,
              body,
              labels: ["legal-content-review"]
            });
