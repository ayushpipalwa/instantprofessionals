name: Service icon validation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  service-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/performance/font-requirements.txt
      - run: python scripts/build_service_icons.py --check
